<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste de câmera</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0b1220; color: #e6eefc; margin: 0; padding: 20px; }
  video { width: 100%; max-width: 480px; background: #000; border-radius: 10px; display: block; margin: 12px 0; }
  button { padding: 10px 16px; border-radius: 8px; border: 0; background: #22d3ee; font-weight: 600; cursor: pointer; margin-right: 8px; }
  pre { background: #111a2e; padding: 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; font-size: 13px; }
</style>
</head>
<body>
  <h1>Teste de câmera</h1>
  <p>Página mínima: usa só <code>getUserMedia</code>, sem MediaPipe.</p>
  <button id="go">Testar câmera</button><button id="stop">Parar</button>
  <video id="v" playsinline muted autoplay></video>
  <pre id="log">Aguardando…</pre>
<script>
  const log = (t) => { document.getElementById("log").textContent += "\n" + t; };
  const v = document.getElementById("v");
  document.getElementById("log").textContent = "Origem: " + location.origin + "\nContexto seguro: " + window.isSecureContext + "\nNavegador: " + navigator.userAgent;

  document.getElementById("stop").onclick = () => { v.srcObject?.getTracks().forEach((t) => t.stop()); v.srcObject = null; log("Câmera parada."); };

  document.getElementById("go").onclick = async () => {
    if (!navigator.mediaDevices?.getUserMedia) return log("ERRO: getUserMedia indisponível (use http://localhost ou https).");
    const tries = [["video: true", { video: true }], ["frontal", { video: { facingMode: "user" } }], ["HD", { video: { width: { ideal: 1280 }, height: { ideal: 720 } } }]];
    for (const [name, constraints] of tries) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        v.srcObject = stream;
        await v.play();
        const t = stream.getVideoTracks()[0];
        log("OK (" + name + "): " + t.label + " " + JSON.stringify(t.getSettings()));
        break;
      } catch (e) {
        log("FALHOU (" + name + "): " + e.name + " - " + e.message);
      }
    }
    try {
      const list = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput");
      log("Câmeras listadas: " + (list.map((d) => d.label || "(sem nome)").join(" | ") || "nenhuma"));
    } catch (e) { log("enumerateDevices: " + e.message); }
  };
</script>
</body>
</html>
